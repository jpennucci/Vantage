name: Vantage
options:
  bundleIdPrefix: com.jamespennucci
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  Vantage:
    type: application
    platform: iOS
    sources:
      - path: Vantage
    info:
      path: Vantage/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "Vantage logs your GPS coordinates when you save a scouted location."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Vantage can log your location in the background when saving a spot from the lock screen or Siri."
        NSCameraUsageDescription: "Vantage lets you attach a quick reference photo to a saved location."
        NSMicrophoneUsageDescription: "Vantage uses the microphone to record voice notes for a saved location."
        NSSpeechRecognitionUsageDescription: "Vantage transcribes your voice notes into text."
        NSMotionUsageDescription: "Vantage checks whether you were moving when you saved a spot, to auto-tag it (e.g. Driving, On Foot)."
        UIBackgroundModes:
          - remote-notification
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamespennucci.Vantage
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_ASSET_PATHS: ""
        DEVELOPMENT_TEAM: PG3PKC873L
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Vantage/Vantage.entitlements
      properties:
        com.apple.developer.weatherkit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jamespennucci.Vantage
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    dependencies:
      - target: VantageWidget
        embed: true

  VantageMac:
    type: application
    platform: macOS
    sources:
      - path: VantageMac
      - path: Vantage/Models/LocationEntryModel.swift
      - path: Vantage/Models/PhotoAsset.swift
      - path: Vantage/Models/ShotListItem.swift
      - path: Vantage/Models/TripModel.swift
      - path: Vantage/Persistence/VantageModelContainer.swift
      - path: Vantage/Persistence/ActiveTripStore.swift
      - path: Vantage/Services/SunPositionEngine.swift
      - path: Vantage/Services/EntitlementStore.swift
      - path: Vantage/Services/KMLExportService.swift
      - path: Vantage/Services/GoogleMapsLinkParser.swift
      - path: Vantage/Services/SpotImportService.swift
      - path: Vantage/Services/ExternalNavigationService.swift
      - path: Vantage/Views/AddLocationView.swift
      - path: Vantage/Views/ImportHelpView.swift
      - path: Vantage/Theme/AppTheme.swift
      - path: Vantage/Theme/PlatformCompat.swift
      - path: Vantage/Views/MapView.swift
      - path: Vantage/Views/TripsView.swift
      - path: Vantage/Views/EntryDetailView.swift
    info:
      path: VantageMac/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        NSLocationWhenInUseUsageDescription: "Vantage can center the map on your current location."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamespennucci.Vantage
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: PG3PKC873L
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
    entitlements:
      path: VantageMac/VantageMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.jamespennucci.Vantage
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development

  VantageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: VantageWidget
      - path: Vantage/Models/LocationEntryModel.swift
      - path: Vantage/Models/PhotoAsset.swift
      - path: Vantage/Models/ShotListItem.swift
      - path: Vantage/Models/TripModel.swift
      - path: Vantage/Persistence/VantageModelContainer.swift
      - path: Vantage/Persistence/ActiveTripStore.swift
      - path: Vantage/Services/CaptureAndSaveUseCase.swift
      - path: Vantage/Services/SunPositionEngine.swift
      - path: Vantage/Services/LocationCaptureService.swift
      - path: Vantage/Services/WeatherService.swift
      - path: Vantage/Services/AutoTagService.swift
      - path: Vantage/Intents/SaveSpotIntent.swift
    info:
      path: VantageWidget/Info.plist
      properties:
        CFBundleDisplayName: "Vantage"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamespennucci.Vantage.Widget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: PG3PKC873L
        CODE_SIGN_STYLE: Automatic
